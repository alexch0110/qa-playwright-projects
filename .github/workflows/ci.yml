name: CI

on:
  push:
    branches: ["main", "master"]
  pull_request:

jobs:
  api-tests:
    runs-on: ubuntu-latest
    env:
      JWT_SECRET: ${{ secrets.JWT_SECRET }}
      VITE_API_URL: http://localhost:3000

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: |
            apps/api/package-lock.json
            apps/web/package-lock.json
            tests/package-lock.json

      # Setup
      - name: Build & start services (docker compose)
        run: |
          docker compose -f docker-compose.yml -f docker-compose.ci.yml up -d --build

      - name: Debug - containers + api logs
        run: |
          docker compose ps
          docker compose logs --no-color --tail=200 api

      - name: Debug - probe API from runner
        run: |
          echo "curl /health:"
          curl -v --max-time 3 http://localhost:3000/health || true
          echo "curl / (root):"
          curl -v --max-time 3 http://localhost:3000/ || true
          echo "netstat (port 3000):"
          ss -ltnp | grep ':3000' || true

      - name: Wait for API (max 60s)
        run: npx wait-on --timeout 60000 --interval 1000 http://localhost:3000/health

      - name: Install tests deps
        working-directory: tests
        run: npm ci

      - name: Install Playwright browsers
        working-directory: tests
        run: npx playwright install --with-deps

      # Run tests
      - name: Run Playwright tests
        working-directory: tests
        env:
          BASE_URL: http://localhost:3000
          NODE_ENV: test
        run: npx playwright test

      # Logs and reports
      - name: Print API logs on failure
        if: failure()
        run: |
          docker compose logs api

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: tests/playwright-report

      # Cleanup
      - name: Shutdown services
        if: always()
        run: |
          docker compose -f docker-compose.yml -f docker-compose.ci.yml down -v
